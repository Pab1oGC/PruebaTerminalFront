name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Copy web.config
        run: copy web.config dist\web.config

      - name: Crear archivo .env
        run: |
          echo VITE_API_URL=${{ secrets.VITE_API_URL }} >> .env

      - name: Deploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.FRONTEND_WEBSITE_NAME }}
          server-computer-name: ${{ secrets.FRONTEND_SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.FRONTEND_SERVER_USERNAME }}
          server-password: ${{ secrets.FRONTEND_SERVER_PASSWORD }}
          source-path: /dist